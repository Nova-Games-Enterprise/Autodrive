name: Verify recovery foundation
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-09-22
        with:
          persist-credentials: false
      - name: Install Lua 5.4
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4
      - name: Record toolchain
        run: |
          lua5.4 -v
          node --version
      - name: Run regression and resource contract checks
        run: node scripts/verify.mjs
