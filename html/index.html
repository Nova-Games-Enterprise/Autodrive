<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; base-uri 'none'; object-src 'none'">
  <title>NGE Autodrive</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <main id="panel" hidden aria-label="NGE vehicle assistance">
    <header><span class="brand">NGE <span class="divider">/</span> AUTODRIVE</span><span class="preview">PREVIEW</span></header>
    <div class="readout"><strong id="speed">0</strong><span id="units">km/h</span><span class="caption">SET SPEED</span></div>
    <div class="statuses" role="status" aria-live="polite">
      <div><span class="label">WAYPOINT DRIVE</span><strong id="autopilot">OFF</strong></div>
      <div><span class="label">COLLISION ASSIST</span><strong id="safety">OFF</strong></div>
    </div>
    <p id="reason">Engineering preview. Stay in control.</p>
    <footer>Toggle collision assist to return to unassisted driving.</footer>
  </main>
  <script src="index.js"></script>
</body>
</html>
